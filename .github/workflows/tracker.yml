name: Moodle Spectrum Tracker 24/7

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore Session Cookies from Secret
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -n "$STORAGE_STATE_BASE64" ]; then
            echo "$STORAGE_STATE_BASE64" | base64 -d > storage_state.json
            echo "Restored storage_state.json successfully."
          fi

      - name: Run Spectrum Scraper
        env:
          SPECTRUM_USERNAME: ${{ secrets.SPECTRUM_USERNAME }}
          SPECTRUM_PASSWORD: ${{ secrets.SPECTRUM_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Commit & Save State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_items.json
          git diff-index --quiet HEAD || git commit -m "chore: auto-update tracker state [skip ci]"
          git pull --rebase origin main
          git push