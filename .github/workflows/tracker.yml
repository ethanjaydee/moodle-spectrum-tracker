name: Moodle Spectrum Tracker 24/7

on:
  schedule:
    # GitHub Actions uses UTC. Avoid minute 0, which is a high-load period.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: moodle-spectrum-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore Session Cookies from Secret
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -n "$STORAGE_STATE_BASE64" ]; then
            echo "$STORAGE_STATE_BASE64" | base64 -d > storage_state.json
            echo "Restored storage_state.json successfully."
          fi

      - name: Run Spectrum Scraper
        env:
          SPECTRUM_USERNAME: ${{ secrets.SPECTRUM_USERNAME }}
          SPECTRUM_PASSWORD: ${{ secrets.SPECTRUM_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
          AI_ANNOUNCEMENT_ENABLED: ${{ secrets.AI_ANNOUNCEMENT_ENABLED }}
          AI_ANNOUNCEMENT_THRESHOLD: ${{ secrets.AI_ANNOUNCEMENT_THRESHOLD }}
          AI_ANNOUNCEMENT_DRY_RUN: ${{ secrets.AI_ANNOUNCEMENT_DRY_RUN }}
          TRACKER_USE_XVFB: "true"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python tracker.py

      - name: Commit & Save State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp seen_items.json /tmp/seen_items.local.json
          git fetch origin main
          git show origin/main:seen_items.json > /tmp/seen_items.remote.json 2>/dev/null || echo "[]" > /tmp/seen_items.remote.json
          python - <<'PY'
          import json
          from pathlib import Path

          local_path = Path("/tmp/seen_items.local.json")
          remote_path = Path("/tmp/seen_items.remote.json")
          local_items = json.loads(local_path.read_text(encoding="utf-8"))
          remote_items = json.loads(remote_path.read_text(encoding="utf-8"))
          merged_items = list(dict.fromkeys(remote_items + local_items))
          Path("seen_items.json").write_text(
              json.dumps(merged_items, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git reset --mixed origin/main
          git add -f seen_items.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update tracker state [skip ci]"
            git push origin main
          fi